version: '3.8'

services:
  funfriday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funfriday-game-arena
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - PORT=5000
    env_file:
      - backend/.env
